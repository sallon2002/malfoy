<!doctype html>
<html lang="ko" data-theme="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>말포이 양은 솔직하지 않다</title>
    <meta name="description" content="해리 포터 젠더스왑 팬픽 연재 — 말포이 양은 솔직하지 않다 / マルフォイ嬢は素直じゃない" />
    <meta name="theme-color" content="#0b0e22" />
    <!-- 아이폰 「홈 화면에 추가」: 주소창 없이 책 앱처럼 열리고, 아이콘·이름이 붙는다 (이름은 고른 언어로 바뀐다) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="말포이 양" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <!-- 한국어 본문 Noto Serif KR, 일본어 본문 Noto Serif JP, 화면 글씨 Pretendard.
         그림책 손글씨는 나눔손글씨 펜(한국어) · Klee One(일본어). 오프라인이면 시스템 폰트로 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Nanum+Pen+Script&family=Klee+One:wght@600&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=20261027a" />
  </head>
  <body>
    <!-- ───────── 서재 (표지 + 이어 읽기 + 목차) ───────── -->
    <main id="library" class="view">
      <header class="cover">
        <svg class="sky" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g id="dust"></g>
          <!-- 제목과 겹치지 않게 용자리를 위쪽에 작게 -->
          <g transform="translate(24 -4) scale(0.7)">
            <g class="draco">
              <polyline points="70,20 80,25 77,35 67,31 70,20" />
              <polyline points="67,31 57,43 62,55 50,62 38,57 29,66 35,77 22,84" />
            </g>
            <g id="draco-stars"></g>
          </g>
        </svg>

        <div class="lang-toggle" role="group" aria-label="언어 / 言語">
          <button type="button" data-lang="ko">KR</button>
          <button type="button" data-lang="ja">JP</button>
        </div>

        <div class="cover-text">
          <p class="kicker" data-t="kicker"></p>
          <h1 data-t="coverTitle"></h1>
          <p class="cover-sub" id="cover-sub"></p>
        </div>
      </header>

      <section class="continue" id="continue" aria-live="polite"></section>

      <section class="toc">
        <h2 data-t="toc"></h2>
        <div id="toc"></div>
      </section>

      <footer class="lib-foot">
        <p data-t="foot1"></p>
        <p class="tip" data-t="foot2"></p>
      </footer>
    </main>

    <!-- ───────── 읽기 화면 ───────── -->
    <div id="reader" class="view" hidden>
      <header class="bar bar-top" id="bar-top">
        <button class="bar-btn" id="back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          <span data-t="back"></span>
        </button>
        <p class="bar-title" id="bar-title"></p>
        <button class="bar-btn aa" id="open-settings" type="button"><span id="aa-glyph">가</span><small id="aa-glyph-s">가</small></button>
        <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      </header>

      <!-- 책장: 본문을 화면 너비의 단(column)으로 흘려서 한 장씩 넘긴다 -->
      <div class="stage" id="stage">
        <article class="flow page" id="page"></article>
      </div>
      <p class="folio" id="folio" aria-live="polite"></p>
    </div>
    <div class="safe-probe" id="safe-probe" aria-hidden="true"></div>

    <!-- ───────── 보기 설정 시트 ───────── -->
    <div class="sheet-bg" id="sheet-bg" hidden></div>
    <section class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="row">
        <span class="row-label" data-t="lang"></span>
        <div class="seg" data-group="lang">
          <button type="button" data-act="lang" data-v="ko">KR</button>
          <button type="button" data-act="lang" data-v="ja">JP</button>
        </div>
      </div>
      <div class="row">
        <span class="row-label" data-t="size"></span>
        <div class="stepper">
          <button type="button" data-act="size" data-v="-1" class="glyph"></button>
          <output id="size-out">18</output>
          <button type="button" data-act="size" data-v="1" class="glyph big"></button>
        </div>
      </div>
      <div class="row">
        <span class="row-label" data-t="lead"></span>
        <div class="seg" data-group="lead">
          <button type="button" data-act="lead" data-v="0" data-t="lead0"></button>
          <button type="button" data-act="lead" data-v="1" data-t="lead1"></button>
          <button type="button" data-act="lead" data-v="2" data-t="lead2"></button>
        </div>
      </div>
      <div class="row">
        <span class="row-label" data-t="font"></span>
        <div class="seg" data-group="font">
          <button type="button" data-act="font" data-v="serif" class="f-serif" data-t="serif"></button>
          <button type="button" data-act="font" data-v="sans" class="f-sans" data-t="sans"></button>
        </div>
      </div>
      <div class="row">
        <span class="row-label" data-t="theme"></span>
        <div class="swatches" data-group="theme">
          <button type="button" data-act="theme" data-v="paper" class="sw sw-paper" data-t="paper"></button>
          <button type="button" data-act="theme" data-v="sepia" class="sw sw-sepia" data-t="sepia"></button>
          <button type="button" data-act="theme" data-v="night" class="sw sw-night" data-t="night"></button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status"></div>
    <div class="lightbox" id="lightbox" hidden></div>

    <!-- 원고 데이터는 열 때마다 새로 받는다: GitHub Pages가 페이지를 최대 10분 붙잡고 있어도, 새 화는 바로 보이게 -->
    <script>
      document.write('<script src="data/chapters.js?t=' + Date.now() + '"><\/script>');
    </script>
    <script src="app.js?v=20261027a"></script>
  </body>
</html>
